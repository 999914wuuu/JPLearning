/* ===== 工具 ===== */
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plainName=n=>String(n).replace(/（[^）]*）/g,"");
const rubyName=n=>esc(n).replace(/([㐀-鿿々]+)（([^）]+)）/g,"<ruby>$1<rt>$2</rt></ruby>");
const isGo=c=>/へ行きます$/.test(c.front);
// 「シャワーを浴びます」→ 受詞跟動詞分兩行
function twoLines(t){const m=String(t).match(/^(.*[をにへとで])(.+)$/);return m?`<span>${esc(m[1])}</span><span>${esc(m[2])}</span>`:`<span>${esc(t)}</span>`}
function twoLinesBr(t){const m=String(t).match(/^(.*[をにへとで])(.+)$/);return m?`${esc(m[1])}<br>${esc(m[2])}`:esc(t)}

/* ===== 資料載入 ===== */
let DATA={cards:FALLBACK_CARDS,chars:FALLBACK_CHARS,online:false};
const imgCache={};

async function loadData(deck){
  if(!API){setVer();return}
  try{
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),10000);
    const r=await fetch(API+"?deck="+encodeURIComponent(deck),{signal:ctl.signal});
    clearTimeout(t);
    const j=await r.json();
    if(j.ok&&j.cards.length){DATA={cards:j.cards,chars:j.chars.length?j.chars:FALLBACK_CHARS,online:true}}
  }catch(e){console.warn("API 讀取失敗，改用內建資料",e)}
  setVer();
}
function setVer(){$("#ver").textContent="v2.3"+(API&&!DATA.online?"・離線":"")}

// 圖片：先直接載入，失敗再請 Apps Script 代轉，再失敗就顯示 emoji
function imgTag(url,emoji,cls){
  if(!url)return emoji?`<div class="emo ${cls||""}">${esc(emoji)}</div>`:"";
  const src=imgCache[url]||url;
  return `<img class="${cls||""}" src="${esc(src)}" data-url="${esc(url)}" data-emoji="${esc(emoji||"")}" alt="" referrerpolicy="no-referrer" onerror="imgFail(this)">`;
}
async function imgFail(el){
  const url=el.dataset.url, emoji=el.dataset.emoji;
  el.onerror=null;
  if(API&&!el.dataset.tried){
    el.dataset.tried="1";
    try{
      const r=await fetch(API+"?img="+encodeURIComponent(url));const j=await r.json();
      if(j.ok){imgCache[url]=j.data;el.onerror=()=>swapEmoji(el,emoji);el.src=j.data;return}
    }catch(e){}
  }
  swapEmoji(el,emoji);
}
function swapEmoji(el,emoji){
  if(emoji){const d=document.createElement("div");d.className="emo "+el.className;d.textContent=emoji;el.replaceWith(d)}else el.remove();
}

/* ===== 導覽 ===== */
let lesson=LESSONS[0], sec=lesson.sections[0];
function buildNav(){
  $("#lessonSel").innerHTML=LESSONS.map(l=>`<option value="${l.id}">${esc(l.label)}</option>`).join("");
  $("#lessonSel").value=lesson.id;
  $("#lessonTitle").textContent=lesson.title;
  document.title=lesson.label+" "+lesson.title;
  $("#secNav").innerHTML=lesson.sections.map(s=>`<button class="pill${s===sec?" on":""}" data-k="${s.key}">${s.name}</button>`).join("");
  $("#secNav").querySelectorAll("button").forEach(b=>b.onclick=()=>{sec=lesson.sections.find(s=>s.key===b.dataset.k);buildNav();render();window.scrollTo(0,0)});
}
$("#lessonSel").onchange=async e=>{lesson=LESSONS.find(l=>l.id===e.target.value);sec=lesson.sections[0];buildNav();await loadData(lesson.deck);render()};

/* ===== 投影片 ===== */
function renderSlides(key){
  const list=SLIDES[key];let i=0;
  $("#view").innerHTML=`<div class="slides"><div class="track">${list.map(h=>`<div class="slide">${h}</div>`).join("")}</div></div>
  <div class="dots">${list.map(()=>"<i></i>").join("")}</div>
  <div class="snav"><button class="btn" id="prev">上一頁</button><button class="btn main" id="next">下一頁</button></div>`;
  const track=$(".track"),dots=[...document.querySelectorAll(".dots i")];
  const go=n=>{i=Math.max(0,Math.min(list.length-1,n));track.style.transform=`translateX(${-i*100}%)`;dots.forEach((d,k)=>d.classList.toggle("on",k===i))};
  $("#prev").onclick=()=>go(i-1);$("#next").onclick=()=>go(i+1);
  let sx=null,sy=null;const el=$(".slides");
  el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  el.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(i+(dx<0?1:-1));sx=null},{passive:true});
  go(0);
}

/* ===== 練習 ===== */
let mode="te";
function deckCards(){
  return DATA.cards.filter(c=>c.deck===lesson.deck&&(!lesson.maxLesson||!c.lesson||c.lesson<=lesson.maxLesson));
}
// 抽卡：「〇〇へ行きます」一次最多一張
function draw(n){
  const out=[];let go=false;
  for(const c of shuffle(deckCards())){
    if(isGo(c)){if(go)continue;go=true}
    out.push(c);if(out.length===n)break;
  }
  return out;
}
function times(n){
  const pool=[];for(let h=6;h<=22;h++){pool.push({h,m:0});pool.push({h,m:30})}
  let s;do{s=shuffle(pool).slice(0,n).sort((a,b)=>a.h*60+a.m-(b.h*60+b.m))}while(new Set(s.map(x=>x.h)).size<n);
  return s.map(x=>x.h+"時"+(x.m?"半":""));
}
const places=c=>String(c.extra||"").split(/[、,，]/).map(x=>x.trim()).filter(Boolean);

function charImg(ch){
  if(ch.img)return ch.img;
  const f=CHAR_FILES[plainName(ch.name)];return f?`chars/${f}.png`:"";
}

function renderPractice(level){
  const n=mode==="te"?3:2;
  const cards=draw(n);
  if(cards.length<n){$("#view").innerHTML=`<div class="box">卡片不夠，請在 Sheet 裡多加幾張。</div>`;return}
  const ch=pick(DATA.chars), name=plainName(ch.name);
  const tms=level===3?times(n):[];
  const pls=cards.map(c=>level===3&&places(c).length?pick(places(c)):"");
  const face=(c,k)=>{
    const tag=level===3?`<div class="tags"><span>${tms[k]}</span>${pls[k]?`<span>${esc(pls[k])}</span>`:""}</div>`:"";
    const mark=level<3&&c.mark?`<span class="mark">${esc(c.mark)}</span>`:"";
    const word=level===1?`<div class="word fit">${twoLines(c.front)}</div>`:"";
    // 翻面只給提示：初級只顯示「類」；中級、高級多給ます形（不寫て形）
    const back=level===1
      ?`<div class="grp only">${esc(c.hint||"")}</div>`
      :`<div class="te">${twoLines(c.front)}</div>${c.hint?`<div class="grp">${esc(c.hint)}</div>`:""}`;
    return `<div class="card"><div class="inner">
      <div class="face lv${level}${level===3?" hastag":""}">${tag}${mark}<div class="pic">${imgTag(c.img,c.emoji)}</div>${word}</div>
      <div class="face back"><div class="bk fit">${back}</div></div>
    </div></div>`;
  };
  const hint=mode==="te"
    ?`${esc(name)}は<span class="nw"><span class="bl"></span>て、</span><span class="nw"><span class="bl"></span>て、</span><span class="nw"><span class="bl"></span>ます。</span>`
    :`${esc(name)}は<span class="nw"><span class="bl"></span>てから、</span><span class="nw"><span class="bl"></span>ます。</span>`;
  const seg=(c,k,last)=>{
    const pre=level===3?`${tms[k]}に${pls[k]?pls[k]+"で":""}`:"";
    if(last)return pre+c.front+"。";
    return pre+c.back+(mode==="kara"?"から":"")+"、";
  };
  const answer=name+"は"+cards.map((c,k)=>seg(c,k,k===n-1)).join("");
  const ci=charImg(ch);
  $("#view").innerHTML=`
   <div class="modes"><button class="pill${mode==="te"?" on":""}" data-m="te">〜て、〜て、〜ます</button><button class="pill${mode==="kara"?" on":""}" data-m="kara">〜てから、〜ます</button></div>
   <div class="who"><div class="card ccard"><div class="face"><div class="cpic">${ci?imgTag(ci,""):""}</div><div class="cname fit">${rubyName(ch.name)}</div></div></div>${level===1?`<div class="box hint big"><div>${hint}</div></div>`:`<div class="box title">${esc(name)}の1日</div>`}</div>
   <div class="grid${n===2?" two":""}">${cards.map(face).join("")}</div>
   <div class="box ans" id="ans">${esc(answer)}</div>
   <div class="btns"><button class="btn" id="showAns">看答案</button><button class="btn main" id="again">再抽一次</button></div>
   <div class="note">點卡片可以翻面</div>`;
  document.querySelectorAll(".card:not(.ccard)").forEach(c=>c.onclick=()=>c.classList.toggle("flip"));
  document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;renderPractice(level)});
  $("#showAns").onclick=()=>{const a=$("#ans");a.classList.toggle("show");$("#showAns").textContent=a.classList.contains("show")?"收起答案":"看答案"};
  $("#again").onclick=()=>renderPractice(level);
  fitAll();
}

// 字太長就縮小，直到塞進框裡
function fitAll(){
  document.querySelectorAll(".fit,.tags span").forEach(el=>{
    el.style.fontSize="";
    let fs=parseFloat(getComputedStyle(el).fontSize);
    const over=()=>el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1;
    while(over()&&fs>9){fs-=1;el.style.fontSize=fs+"px"}
  });
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
let rsz;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(fitAll,150)});

function render(){
  if(sec.type==="slides")renderSlides(sec.slides);else renderPractice(sec.level);
}

(async()=>{buildNav();setVer();render();await loadData(lesson.deck);if(sec.type==="practice")render()})();

</script>
