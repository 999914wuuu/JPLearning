<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>日語教室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='14' width='56' height='36' rx='5' fill='white' stroke='%23B5D4F4' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23BC002D'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#F4F9FE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 主題 ===== */
:root,[data-theme=blue]{
  --bg:#F4F9FE; --pat:linear-gradient(#DCEBFA 1px,transparent 1px),linear-gradient(90deg,#DCEBFA 1px,transparent 1px); --patsize:22px 22px;
  --card:#FFFFFF; --line:#B5D4F4; --soft:#E6F1FB; --mid:#378ADD; --main:#185FA5; --ink:#0C447C; --sub:#185FA5; --onmain:#FFFFFF;
  --tm:#E6F1FB; --tmink:#0C447C; --pl:#E1F5EE; --plink:#085041; --dim:rgba(12,40,80,.32);
}
[data-theme=cream]{
  --bg:#FFF7E0; --pat:radial-gradient(#EBD49A 1.3px,transparent 1.6px); --patsize:16px 16px;
  --card:#FFFFFF; --line:#EBD49A; --soft:#FFF1CC; --mid:#B07D1A; --main:#9A6B12; --ink:#5B4316; --sub:#7A5612; --onmain:#FFFFFF;
  --tm:#FFF1CC; --tmink:#5B4316; --pl:#F3EAD8; --plink:#6B4A10; --dim:rgba(60,40,0,.28);
}
[data-theme=green]{
  --bg:#F2FAF5; --pat:none; --patsize:auto;
  --card:#FFFFFF; --line:#BFE3CF; --soft:#E3F4EA; --mid:#3E9A70; --main:#2F7D5B; --ink:#1F5A40; --sub:#2F7D5B; --onmain:#FFFFFF;
  --tm:#E3F4EA; --tmink:#1F5A40; --pl:#EEF2E4; --plink:#4A5A1F; --dim:rgba(20,50,35,.3);
}
[data-theme=light]{
  --bg:#FAFAFA; --pat:none; --patsize:auto;
  --card:#FFFFFF; --line:#DDDDDD; --soft:#F0F0F0; --mid:#666666; --main:#333333; --ink:#222222; --sub:#555555; --onmain:#FFFFFF;
  --tm:#F0F0F0; --tmink:#222222; --pl:#E9EEF0; --plink:#2C3A40; --dim:rgba(0,0,0,.3);
}
[data-theme=dark]{
  --bg:#1E2024; --pat:none; --patsize:auto;
  --card:#2A2D33; --line:#3A3E46; --soft:#33373F; --mid:#9AA3AE; --main:#9DB8D9; --ink:#EEEEEE; --sub:#B8C2CE; --onmain:#1E2024;
  --tm:#33373F; --tmink:#DDE6F0; --pl:#2F3A36; --plink:#BFE3CF; --dim:rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans TC","Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Microsoft JhengHei",system-ui,sans-serif;
  color:var(--ink); background:var(--bg); background-image:var(--pat); background-size:var(--patsize); background-attachment:fixed;
  font-size:18px; line-height:1.6; min-height:100vh; -webkit-tap-highlight-color:transparent;
}
[lang=ja]{font-family:"Noto Sans JP","Noto Sans TC","Hiragino Sans",sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
/* 假名：大小 0.5em、行距 0.6 */
rt{font-size:.5em;font-weight:400;line-height:.6}
body.nokana .vwrap rt{display:none}

/* ===== 版面 ===== */
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--main);display:flex;align-items:center;justify-content:center}
.topbar .ttl{flex:1;min-width:0;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver{font-size:13px;color:var(--sub);white-space:nowrap}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
/* 毛絨奶油黃：白色方塊外圍一圈圓圓的毛邊 */
[data-theme=cream] .box,[data-theme=cream] .fluff{position:relative;isolation:isolate;border-color:transparent}
[data-theme=cream] .box::before,[data-theme=cream] .fluff::before{content:"";position:absolute;inset:-7px;border-radius:22px;z-index:-1;
  background:radial-gradient(circle,#FFFFFF 6.6px,transparent 7.2px) 0 0/14px 14px;filter:drop-shadow(0 3px 5px rgba(170,125,40,.22))}
[data-theme=cream] .box::after,[data-theme=cream] .fluff::after{content:"";position:absolute;inset:0;border-radius:inherit;background:inherit;z-index:-1}

/* 側邊欄 */
.dim{position:fixed;inset:0;background:var(--dim);z-index:20}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);background:var(--card);z-index:21;display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));box-shadow:4px 0 18px rgba(0,0,0,.15);
  transform:translateX(-105%);transition:transform .25s;overflow-y:auto}
.drawer.open{transform:none}
.me{display:flex;align-items:center;gap:12px;padding:4px 6px 14px;border-bottom:1px solid var(--soft);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.ava{width:48px;height:48px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.me b{display:block;font-size:17px}
.me small{display:block;font-size:13px;color:var(--sub)}
.grp-t{font-size:13px;font-weight:700;color:var(--sub);padding:16px 8px 6px;letter-spacing:.05em}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;border-radius:12px;font-size:16px;background:none;border:0;text-align:left;color:var(--ink)}
.nav-i.on{background:var(--main);color:var(--onmain);font-weight:500}
.nav-i:disabled{color:var(--mid);cursor:default}
.soon{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--sub);white-space:nowrap}
.dfoot{margin-top:auto;display:flex;align-items:center;gap:8px;border-top:1px solid var(--soft);padding-top:12px}
.dfoot .ver{flex:1}
.textbtn{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--main);font-size:15px}

/* 主題選單 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:24px 24px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto}
.sheet .handle{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h2{font-size:18px;padding:4px 2px}
.th{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:17px;font-weight:500;text-align:left}
.th.on{border:2px solid var(--main)}
.th i{width:30px;height:30px;border-radius:9px;border:1px solid #D9D2C0;display:flex;align-items:center;justify-content:center}
.th i::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.th span{flex:1}
.vrow{display:flex;gap:8px}
.vrow select{flex:1;min-width:0;height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;color:var(--ink)}
.sheet small{font-size:13px;color:var(--sub)}

/* 登入、開通、第一次登入 */
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 24px;text-align:center;max-width:420px;margin:0 auto}
.center h1{font-size:28px}
.center p{color:var(--sub);font-size:16px}
.gbtn{min-height:44px;display:flex;justify-content:center}
.small{font-size:13px;color:var(--sub)}
.form{width:100%;display:flex;flex-direction:column;gap:14px;text-align:left}
.form label{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:500}
.form input{height:52px;border-radius:14px;border:1px solid var(--line);padding:0 14px;font-size:17px;background:var(--card)}
.avs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.avs button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:32px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.avs button.on{border:2px solid var(--main);background:var(--soft)}
.btn{flex:1;font-size:17px;padding:12px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--main)}
.btn.main{background:var(--main);color:var(--onmain);border-color:var(--main)}
.btn:disabled{opacity:.5}

/* ===== 上課（v2.4 內容） ===== */
h1.lt{font-size:24px;font-weight:700;text-align:center;margin:0 0 12px}
.secnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-bottom:12px}
.secnav .pill{font-size:14px;padding:7px 0;text-align:center;letter-spacing:-0.02em}
.pill{font-size:16px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--main);white-space:nowrap}
.pill.on{background:var(--main);color:var(--onmain);border-color:var(--main)}
.title{text-align:center;font-size:21px;font-weight:500}
.who{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px;align-items:start;margin-bottom:12px}
.who .box{align-self:stretch}
.hint.big{margin-top:0;display:flex;align-items:center;font-size:clamp(16px,4.6vw,20px)}
.who .title{display:flex;align-items:center;justify-content:center}
.ccard{cursor:default}
.cpic{position:absolute;left:6px;right:6px;top:6px;bottom:44px}
.cpic img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.cname{position:absolute;left:4px;right:4px;bottom:4px;height:38px;display:flex;align-items:flex-end;justify-content:center;white-space:nowrap;overflow:hidden;line-height:1.3;font-size:clamp(14px,4vw,17px);font-weight:500}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:12px}
.modes .pill{font-size:15px;padding:7px 4px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr));width:67%;margin:0 auto}
.card{position:relative;height:0;padding-top:133.333%;perspective:800px;cursor:pointer;user-select:none;-webkit-user-select:none}
.inner{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ccard .face{backface-visibility:visible}
.back{background:var(--soft);transform:rotateY(180deg)}
.emo{font-size:clamp(34px,11vw,52px);line-height:1.15;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.word{position:absolute;left:4px;right:4px;bottom:6px;height:34%;overflow:hidden;font-size:clamp(15px,4.4vw,19px);font-weight:500;line-height:1.3;display:flex;flex-direction:column;justify-content:center;align-items:center}
.word span,.te span{display:block;white-space:nowrap}
.bk{position:absolute;left:4px;right:4px;top:6px;bottom:6px;overflow:hidden;font-size:clamp(16px,4.6vw,20px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.te{font-size:1em;font-weight:500;line-height:1.35;display:flex;flex-direction:column;align-items:center}
.grp{font-size:.88em;color:var(--sub);margin-top:8px;white-space:nowrap}
.grp.only{font-size:1.4em;font-weight:700;color:var(--main);margin-top:0}
.tags{position:absolute;top:6px;left:6px;right:6px;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.tags span{max-width:100%;overflow:hidden;white-space:nowrap;font-size:clamp(13px,3.8vw,15px);font-weight:500;padding:0 8px;border-radius:999px;background:var(--soft);color:var(--main)}
.hint{margin-top:12px;font-size:clamp(17px,4.8vw,20px);line-height:1.8}
.nw{white-space:nowrap}
.bl{display:inline-block;width:2.4em;height:1.1em;border-bottom:2px solid var(--mid);vertical-align:baseline;margin:0 3px}
.btns{display:flex;gap:8px;margin-top:12px}
.ans{margin-top:12px;font-size:clamp(17px,4.8vw,20px);line-height:1.8;display:none}
.ans.show{display:block}
.note{font-size:14px;color:var(--sub);text-align:center;margin-top:10px}
.slides{overflow:hidden;touch-action:pan-y;padding:8px 8px 0}
.track{display:flex;transition:transform .35s;gap:16px}
.slide{flex:0 0 100%}
.slide .box{min-height:330px}
.st{font-size:20px;font-weight:700;margin-bottom:6px}
.sub{font-size:16px;color:var(--sub);margin-bottom:12px;line-height:1.6}
.ex{font-size:19px;line-height:1.8;padding:10px 12px;background:var(--bg);border-radius:10px;margin-top:8px}
.ex small{display:block;font-size:15px;color:var(--sub)}
.pair{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:17px;line-height:1.7}
.pair .pr+.pr{border-top:1px dashed var(--line);margin-top:4px;padding-top:4px}
.pair small{display:block;font-size:14px;color:var(--sub);margin-top:4px}
.ng{color:#C23B3B;font-weight:700;margin-right:4px}
.ok{color:#169B76;font-weight:700;margin-right:4px}
.two-col{display:grid;grid-template-columns:1fr;gap:10px}
.mini{border:1px solid var(--line);border-radius:12px;padding:10px}
.mini .st{font-size:17px}
.mini .sub{font-size:14px;margin-bottom:6px}
.mini .ex{font-size:16px}
.sumt{width:100%;border-collapse:collapse;font-size:16px}
.sumt th,.sumt td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.sumt th{background:var(--soft);font-weight:500}
.dots{display:flex;justify-content:center;gap:8px;margin-top:10px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--main)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.blk{display:flex;flex-direction:column;align-items:center;gap:3px}
.b{border-radius:9px;padding:6px 10px;font-size:19px;line-height:1.4}
.lab{font-size:14px;color:var(--sub)}
.tm{background:var(--tm);color:var(--tmink)}
.pl{background:var(--pl);color:var(--plink)}
.ac{background:var(--main);color:var(--onmain)}
.arrow{text-align:center;font-size:24px;color:var(--mid);margin:6px 0}
.pic{position:absolute;left:6px;right:6px;top:6px;bottom:6px;display:flex;align-items:center;justify-content:center}
.pic img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.face.lv1 .pic{bottom:calc(34% + 8px)}
.face.hastag .pic{top:54px}
.mark{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:17px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;z-index:1}
@media (max-width:340px){.secnav .pill{font-size:12px}.modes .pill{font-size:13px}.wrap{padding-left:10px;padding-right:10px}.grid{gap:6px}}

/* ===== 單字卡 ===== */
.vctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vctl label{display:flex;align-items:center;gap:6px;font-size:16px}
.vctl select{height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:500;color:var(--ink)}
.vctl .sp{flex:1}
.vfil{display:flex;gap:8px;margin-top:8px}
.vfil select{flex:1;min-width:0;height:44px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500;color:var(--ink)}
.vfil select.on{border-color:var(--accent,var(--ink));font-weight:700}
.tgl{height:36px;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500;color:var(--ink)}
.tgl i{width:40px;height:26px;border-radius:999px;background:var(--line);display:flex;align-items:center;padding:3px;transition:background .2s}
.tgl i::after{content:"";width:20px;height:20px;border-radius:50%;background:#FFFFFF;transition:transform .2s}
.tgl[aria-pressed=true] i{background:var(--main)}
.tgl[aria-pressed=true] i::after{transform:translateX(14px)}
.vprog{font-size:14px;color:var(--sub);margin:10px 2px}
.vcard{position:relative;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:56px 18px 24px;cursor:pointer;user-select:none;-webkit-user-select:none;text-align:center}
.vcard.backside{background:var(--soft)}
.vspk{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--main);display:flex;align-items:center;justify-content:center}
.vcard.backside .vspk{background:var(--card)}
.vpos{position:absolute;top:14px;left:14px;font-size:14px;font-weight:500;padding:4px 12px;border-radius:999px;background:var(--card);color:var(--main);border:1px solid var(--line)}
.reveal{min-width:220px;max-width:100%;min-height:64px;padding:8px 16px;border-radius:14px;border:2px dashed var(--line);background:var(--card);color:var(--sub);font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.reveal.open{border-style:solid;color:var(--ink);font-size:30px;font-weight:700;line-height:1.6}
.vhint{font-size:14px;color:var(--sub)}
.vzh{font-size:36px;font-weight:700;line-height:1.3}
.vjp{font-size:22px;color:var(--main);line-height:1.6}
.vex{margin-top:12px;cursor:default}
.vex .jp{font-size:20px;line-height:1.6;padding-top:.35em}
.vex .jp.tap{cursor:pointer}
.vex .zh{font-size:16px;color:var(--sub);border-top:1px dashed var(--line);padding-top:4px;margin-top:4px}
.vex small{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.blank{display:inline-block;min-width:4.2em;border-bottom:2px solid var(--main);margin:0 4px;height:1.1em;vertical-align:baseline}
.tgt{font-weight:700;color:var(--main);border-bottom:2px solid var(--main)}
.vnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.vnav .btn{display:flex;align-items:center;justify-content:center;gap:6px}
.empty{text-align:center;color:var(--sub)}
</style>
</head>
<body data-theme="blue">

<!-- 登入 -->
<section id="scrLogin" class="center hide">
  <svg aria-hidden="true" width="96" height="72" viewBox="0 0 64 48"><rect x="2" y="2" width="60" height="44" rx="7" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="2"/><circle cx="32" cy="24" r="11" fill="#BC002D"/></svg>
  <h1>日語教室</h1>
  <p>上課練習和背單字都在這裡</p>
  <div id="gbtn" class="gbtn"></div>
  <div class="small">只會用到你的 email 和名字・<a href="privacy.html" style="color:inherit">隱私權說明</a></div>
  <div class="small" id="loginMsg"></div>
  <div class="ver" id="verLogin"></div>
</section>

<!-- 還沒開通 -->
<section id="scrNotReg" class="center hide">
  <h1>還沒開通喔</h1>
  <p>已經通知老師了，等老師開通後重新整理就好<br><span id="nrEmail"></span></p>
  <button class="btn" id="nrSwitch" style="flex:none;width:100%">換一個帳號</button>
</section>

<!-- 第一次登入：名字和頭像 -->
<section id="scrProfile" class="center hide">
  <h1 id="pfTitle">第一次登入</h1>
  <p>設定一下名字和頭像，之後點側邊欄的頭像也可以改</p>
  <div class="form">

const THEMES=[["blue","淺藍格子","#F4F9FE","#185FA5"],["cream","毛絨奶油黃","#FFF7E0","#9A6B12"],["green","極簡清新綠","#F2FAF5","#2F7D5B"],["light","淺色","#FAFAFA","#333333"],["dark","深色","#1E2024","#9DB8D9"]];
const AVATARS=["🐰","🐱","🐶","🐻","🐼","🦊","🐨","🐧","🐸","🐯","🐹","🐳"];

/* ===== 工具 ===== */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plainName=n=>String(n).replace(/（[^）]*）/g,"");
const rubyName=n=>esc(n).replace(/([㐀-鿿々]+)（([^）]+)）/g,"<ruby>$1<rt>$2</rt></ruby>");
const isGo=c=>/へ行きます$/.test(c.front);
function twoLines(t){const m=String(t).match(/^(.*[をにへとで])(.+)$/);return m?`<span>${esc(m[1])}</span><span>${esc(m[2])}</span>`:`<span>${esc(t)}</span>`}
const store={get(k,d){try{const v=localStorage.getItem("jp_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("jp_"+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem("jp_"+k)}catch(e){}}};
const ICON_SPK='<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const ICON_EYE='<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_SHUF='<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>';

/* ===== 主題 ===== */
function applyTheme(t){
  document.body.dataset.theme=t;store.set("theme",t);
  const th=THEMES.find(x=>x[0]===t);document.querySelector('meta[name=theme-color]').content=th?th[2]:"#F4F9FE";
  $("#thList").innerHTML=THEMES.map(([k,n,bg,c])=>`<button class="th${k===t?" on":""}" data-k="${k}" aria-pressed="${k===t}"><i style="background:${bg};--c:${c}"></i><span>${n}</span></button>`).join("");
  $$("#thList .th").forEach(b=>b.onclick=()=>applyTheme(b.dataset.k));
}
function openSheet(o){if(o)pickVoice();$("#sheet").classList.toggle("hide",!o);$("#sheetDim").classList.toggle("hide",!o)}
$("#themeBtn").onclick=()=>{closeDrawer();openSheet(true)};
$("#sheetDim").onclick=()=>openSheet(false);

/* ===== 畫面切換 ===== */
function show(id){["scrLogin","scrNotReg","scrProfile","scrMain"].forEach(s=>$("#"+s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}
function setVer(){const t=VERSION+(ME&&ME.offline?"・離線":"");["#ver","#verDrawer","#verLogin"].forEach(s=>$(s).textContent=t)}

/* ===== 登入 ===== */
let ME=null;            // {user, cards, chars, vocab, offline}
let TOKEN=store.get("token",null);
const jwtExp=t=>{try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).exp*1000}catch(e){return 0}};
const tokenOk=()=>TOKEN&&jwtExp(TOKEN)>Date.now()+60000;

function errText(e){return e&&e.name==="AbortError"?"等太久沒回應":e instanceof SyntaxError?"伺服器回傳格式不對":(e&&e.message)||"連不到伺服器"}
async function api(body){
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),30000);
  try{const r=await fetch(API,{method:"POST",body:JSON.stringify(body),signal:ctl.signal});return await r.json()}
  finally{clearTimeout(tm)}
}

let cfgFail=false;
async function getClientId(){
  let id=store.get("clientId","");cfgFail=false;
  const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),10000);
  try{const r=await fetch(API+"?config=1",{signal:ac.signal});const j=await r.json();if(j.ok&&j.clientId){id=j.clientId;store.set("clientId",id)}}catch(e){cfgFail=true}
  finally{clearTimeout(tm)}
  return id;
}

function loadGsi(){
  return new Promise((res,rej)=>{
    if(window.google&&google.accounts)return res();
    const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}

let gsiReady=false;
async function initGsi(){
  const id=await getClientId();
  if(!/apps\.googleusercontent\.com$/.test(id)){$("#loginMsg").textContent=cfgFail?"連不到 Apps Script，請稍後重新整理":"登入還沒設定好（Apps Script 的 CLIENT_ID）";return false}
  try{await loadGsi()}catch(e){$("#loginMsg").textContent="連不到 Google 登入，請檢查網路";return false}
  google.accounts.id.initialize({client_id:id,callback:onCredential,auto_select:true,cancel_on_tap_outside:false});
  gsiReady=true;return true;
}
function renderLogin(){
  show("scrLogin");setVer();
  if(!gsiReady)return;
  const w=Math.min(360,$("#scrLogin").clientWidth-48);
  google.accounts.id.renderButton($("#gbtn"),{theme:"outline",size:"large",shape:"pill",text:"signin_with",width:w,locale:"zh-TW"});
  google.accounts.id.prompt();
}
function onCredential(resp){
  TOKEN=resp.credential;store.set("token",TOKEN);
  loadMe();
}

async function loadMe(){
  try{
    const j=await api({action:"me",token:TOKEN});
    handleMe(j);
  }catch(e){
    const cache=store.get("me",null);
    if(cache){ME={...cache,offline:true};enterApp()}
    else{show("scrLogin");$("#loginMsg").textContent="連線失敗，請稍後再試";}
  }
}
function handleMe(j){
  if(j.ok){ME={user:j.user,cards:j.cards,chars:j.chars,vocab:j.vocab,offline:false};store.set("me",{user:j.user,cards:j.cards,chars:j.chars,vocab:j.vocab});
    if(!j.user.displayName){openProfile(true);return}
    enterApp();return}
  if(j.reason==="not_registered"){store.del("me");show("scrNotReg");$("#nrEmail").textContent=j.email||"";return}
  if(j.error){const m="伺服器錯誤："+j.error;if(!$("#scrProfile").classList.contains("hide")){$("#pfMsg").textContent=m;$("#pfSave").disabled=false;return}show("scrLogin");$("#loginMsg").textContent=m;return}
  // token 過期或無效 → 重新登入
  TOKEN=null;store.del("token");renderLogin();
}
$("#nrSwitch").onclick=()=>{logout()};
function logout(){
  TOKEN=null;ME=null;store.del("token");store.del("me");
  if(window.google&&google.accounts)google.accounts.id.disableAutoSelect();
  closeDrawer();renderLogin();
}
$("#logoutBtn").onclick=logout;

/* ===== 名字和頭像 ===== */
let pfAva=AVATARS[0];
function openProfile(first){
  show("scrProfile");
  $("#pfTitle").textContent=first?"第一次登入":"修改名字和頭像";
  $("#pfSave").textContent=first?"開始":"儲存";
  $("#pfName").value=(ME&&ME.user.displayName)||"";
  pfAva=(ME&&ME.user.avatar)||AVATARS[0];
  $("#pfAvs").innerHTML=AVATARS.map(a=>`<button aria-label="選這個頭像" aria-pressed="${a===pfAva}" class="${a===pfAva?"on":""}" data-a="${a}">${a}</button>`).join("");
  $$("#pfAvs button").forEach(b=>b.onclick=()=>{pfAva=b.dataset.a;$$("#pfAvs button").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-pressed",x===b)})});
  $("#pfMsg").textContent="";
}
$("#pfSave").onclick=async()=>{
  const name=$("#pfName").value.trim();
  if(!name){$("#pfMsg").textContent="請填顯示名稱";return}
  if(!tokenOk()){$("#pfMsg").textContent="登入過期了，請重新登入";setTimeout(logout,1200);return}
  $("#pfSave").disabled=true;$("#pfMsg").textContent="儲存中…";
  try{const j=await api({action:"profile",token:TOKEN,displayName:name,avatar:pfAva});handleMe(j)}
  catch(e){$("#pfMsg").textContent="儲存失敗（"+errText(e)+"），請再試一次"}
  finally{$("#pfSave").disabled=false}
};
$("#meBtn").onclick=()=>{closeDrawer();openProfile(false)};

/* ===== 側邊欄 ===== */
let VIEW=null; // {type:'lesson',id} | {type:'vocab'}
function visibleLessons(){const u=ME.user;return LESSONS.filter(l=>u.teacher||(l.classes||[]).includes(u.cls))}
function buildDrawer(){
  const u=ME.user;
  $("#meAva").textContent=u.avatar||"🐰";$("#meName").textContent=u.displayName||"";
  const ls=visibleLessons();
  let h="";
  if(ls.length){h+=`<div class="grp-t">上課用</div>`+ls.map(l=>`<button class="nav-i${VIEW.type==="lesson"&&VIEW.id===l.id?" on":""}" data-v="lesson" data-id="${l.id}">${esc(l.label)}・${esc(l.title)}</button>`).join("")}
  h+=`<div class="grp-t">背單字用</div>
   <button class="nav-i${VIEW.type==="vocab"?" on":""}" data-v="vocab">單字卡</button>
   <button class="nav-i" disabled>每日挑戰<span class="soon">未來更新</span></button>
   <button class="nav-i" disabled>單字魔人<span class="soon">未來更新</span></button>`;
  $("#navList").innerHTML=h;
  $$("#navList .nav-i[data-v]").forEach(b=>b.onclick=()=>{VIEW=b.dataset.v==="lesson"?{type:"lesson",id:b.dataset.id}:{type:"vocab"};store.set("view",VIEW);closeDrawer();renderView()});
}
function openDrawer(){buildDrawer();$("#drawer").classList.add("open");$("#dim").classList.remove("hide")}
function closeDrawer(){$("#drawer").classList.remove("open");$("#dim").classList.add("hide")}
$("#menuBtn").onclick=openDrawer;$("#dim").onclick=closeDrawer;

function enterApp(){
  show("scrMain");setVer();
  const saved=store.get("view",null),ls=visibleLessons();
  if(saved&&saved.type==="lesson"&&ls.find(l=>l.id===saved.id))VIEW=saved;
  else if(saved&&saved.type==="vocab")VIEW=saved;
  else VIEW=ls.length?{type:"lesson",id:ls[0].id}:{type:"vocab"};
  renderView();
}
function renderView(){
  if(VIEW.type==="lesson"){const l=LESSONS.find(x=>x.id===VIEW.id);openLesson(l)}
  else openVocab();
}

/* ===== 上課 ===== */
const imgCache={};
function imgTag(url,emoji,cls){
  if(!url)return emoji?`<div class="emo ${cls||""}">${esc(emoji)}</div>`:"";
  const src=imgCache[url]||url;
  return `<img class="${cls||""}" src="${esc(src)}" data-url="${esc(url)}" data-emoji="${esc(emoji||"")}" alt="" referrerpolicy="no-referrer" onerror="imgFail(this)">`;
}
async function imgFail(el){
  const url=el.dataset.url,emoji=el.dataset.emoji;el.onerror=null;
  if(!el.dataset.tried){el.dataset.tried="1";
    try{const r=await fetch(API+"?img="+encodeURIComponent(url));const j=await r.json();
      if(j.ok){imgCache[url]=j.data;el.onerror=()=>swapEmoji(el,emoji);el.src=j.data;return}}catch(e){}}
  swapEmoji(el,emoji);
}
function swapEmoji(el,emoji){if(emoji){const d=document.createElement("div");d.className="emo "+el.className;d.textContent=emoji;el.replaceWith(d)}else el.remove()}

let lesson=null,sec=null,mode="te";
function openLesson(l){
  lesson=l;sec=l.sections[0];
  $("#topTitle").textContent=l.label;document.title=l.label+" "+l.title+"｜日語教室";
  $("#main").innerHTML=`<h1 class="lt" lang="ja">${esc(l.title)}</h1><nav class="secnav" id="secNav"></nav><div id="view"></div>`;
  buildSecNav();renderSec();
}
function buildSecNav(){
  $("#secNav").innerHTML=lesson.sections.map(s=>`<button class="pill${s===sec?" on":""}" data-k="${s.key}">${s.name}</button>`).join("");
  $$("#secNav button").forEach(b=>b.onclick=()=>{sec=lesson.sections.find(s=>s.key===b.dataset.k);buildSecNav();renderSec();window.scrollTo(0,0)});
}
function renderSec(){if(sec.type==="slides")renderSlides(sec.slides);else renderPractice(sec.level)}

function renderSlides(key){
  const list=SLIDES[key];let i=0;
  $("#view").innerHTML=`<div class="slides"><div class="track">${list.map(h=>`<div class="slide">${h}</div>`).join("")}</div></div>
  <div class="dots">${list.map(()=>"<i></i>").join("")}</div>
  <div class="btns"><button class="btn" id="prev">上一頁</button><button class="btn main" id="next">下一頁</button></div>`;
  const track=$(".track"),dots=$$(".dots i");
  const go=n=>{i=Math.max(0,Math.min(list.length-1,n));track.style.transform=`translateX(calc(${-i*100}% - ${i*16}px))`;dots.forEach((d,k)=>d.classList.toggle("on",k===i))};
  $("#prev").onclick=()=>go(i-1);$("#next").onclick=()=>go(i+1);
  let sx=null,sy=null;const el=$(".slides");
  el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  el.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(i+(dx<0?1:-1));sx=null},{passive:true});
  go(0);
}

function deckCards(){return ME.cards.filter(c=>c.deck===lesson.deck&&(!lesson.maxLesson||!c.lesson||c.lesson<=lesson.maxLesson))}
function draw(n){
  const out=[];let go=false;
  for(const c of shuffle(deckCards())){if(isGo(c)){if(go)continue;go=true}out.push(c);if(out.length===n)break}
  return out;
}
function times(n){
  const pool=[];for(let h=6;h<=22;h++){pool.push({h,m:0});pool.push({h,m:30})}
  let s;do{s=shuffle(pool).slice(0,n).sort((a,b)=>a.h*60+a.m-(b.h*60+b.m))}while(new Set(s.map(x=>x.h)).size<n);
  return s.map(x=>x.h+"時"+(x.m?"半":""));
}
const places=c=>String(c.extra||"").split(/[、,，]/).map(x=>x.trim()).filter(Boolean);

function renderPractice(level){
  const n=mode==="te"?3:2;
  const cards=draw(n);
  if(cards.length<n||!ME.chars.length){$("#view").innerHTML=`<div class="box">卡片不夠，請在 Sheet 裡多加幾張。</div>`;return}
  const ch=pick(ME.chars),name=plainName(ch.name);
  const tms=level===3?times(n):[];
  const pls=cards.map(c=>level===3&&places(c).length?pick(places(c)):"");
  const face=(c,k)=>{
    const tag=level===3?`<div class="tags"><span>${tms[k]}</span>${pls[k]?`<span>${esc(pls[k])}</span>`:""}</div>`:"";
    const mark=level<3&&c.mark?`<span class="mark">${esc(c.mark)}</span>`:"";
    const word=level===1?`<div class="word fit">${twoLines(c.front)}</div>`:"";
    // 翻面只給提示：初級只顯示「類」；中級、高級多給ます形（不寫て形）
    const back=level===1?`<div class="grp only">${esc(c.hint||"")}</div>`
      :`<div class="te">${twoLines(c.front)}</div>${c.hint?`<div class="grp">${esc(c.hint)}</div>`:""}`;
    return `<div class="card"><div class="inner">
      <div class="face lv${level}${level===3?" hastag":""}" lang="ja">${tag}${mark}<div class="pic">${imgTag(c.img,c.emoji)}</div>${word}</div>
      <div class="face back" lang="ja"><div class="bk fit">${back}</div></div>
    </div></div>`;
  };
  const hint=mode==="te"
    ?`${esc(name)}は<span class="nw"><span class="bl"></span>て、</span><span class="nw"><span class="bl"></span>て、</span><span class="nw"><span class="bl"></span>ます。</span>`
    :`${esc(name)}は<span class="nw"><span class="bl"></span>てから、</span><span class="nw"><span class="bl"></span>ます。</span>`;
  const seg=(c,k,last)=>{const pre=level===3?`${tms[k]}に${pls[k]?pls[k]+"で":""}`:"";if(last)return pre+c.front+"。";return pre+c.back+(mode==="kara"?"から":"")+"、"};
  const answer=name+"は"+cards.map((c,k)=>seg(c,k,k===n-1)).join("");
  $("#view").innerHTML=`
   <div class="modes"><button class="pill${mode==="te"?" on":""}" data-m="te">〜て、〜て、〜ます</button><button class="pill${mode==="kara"?" on":""}" data-m="kara">〜てから、〜ます</button></div>
   <div class="who"><div class="card ccard"><div class="face" lang="ja"><div class="cpic">${ch.img?imgTag(ch.img,""):""}</div><div class="cname fit">${rubyName(ch.name)}</div></div></div>${level===1?`<div class="box hint big" lang="ja"><div>${hint}</div></div>`:`<div class="box title" lang="ja">${esc(name)}の1日</div>`}</div>
   <div class="grid${n===2?" two":""}">${cards.map(face).join("")}</div>
   <div class="box ans" id="ans" lang="ja">${esc(answer)}</div>
   <div class="btns"><button class="btn" id="showAns">看答案</button><button class="btn main" id="again">再抽一次</button></div>
   <div class="note">點卡片可以翻面</div>`;
  $$(".card:not(.ccard)").forEach(c=>c.onclick=()=>c.classList.toggle("flip"));
  $$(".modes button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;renderPractice(level)});
  $("#showAns").onclick=()=>{const a=$("#ans");a.classList.toggle("show");$("#showAns").textContent=a.classList.contains("show")?"收起答案":"看答案"};
  $("#again").onclick=()=>renderPractice(level);
  fitAll();
}
// 字太長就縮小
function fitAll(){
  $$(".fit,.tags span").forEach(el=>{
    el.style.fontSize="";let fs=parseFloat(getComputedStyle(el).fontSize);
    const over=()=>el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1;
    while(over()&&fs>9){fs-=1;el.style.fontSize=fs+"px"}
  });
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
let rsz;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(fitAll,150)});

/* ===== 單字卡 ===== */
// 假名：漢字{よみ}；挖空：《…》
// 數字＋漢字：讀音比較長（例如 3階{さんがい}）或在單字欄、《》裡時，假名蓋住數字
function ruby(s,full){
  return esc(s).replace(/([0-9０-９]*)([㐀-鿿々〆ヶ]+)\{([^}]+)\}/g,(m,d,k,r)=>{
    if(d&&(full||r.length>k.length*2))return `<ruby>${d}${k}<rt>${r}</rt></ruby>`;
    return `${d}<ruby>${k}<rt>${r}</rt></ruby>`;
  });
}
function exampleHTML(s,mode){ // mode: blank | open | full
  const parts=String(s).split(/《|》/);
  return parts.map((p,i)=>{
    if(i%2===0)return ruby(p,false);
    if(mode==="blank")return `<span class="blank" aria-label="空格"></span>`;
    return `<span class="tgt">${ruby(p,true)}</span>`;
  }).join("");
}
function reading(furi){
  return String(furi).replace(/[0-9０-９]*[㐀-鿿々〆ヶ]+\{([^}]+)\}/g,"$1").replace(/[〜～]/g,"");
}
let jaVoice=null;
const jaVoices=()=>"speechSynthesis" in window?speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)):[];
const voiceRank=v=>{const t=(v.name+" "+v.voiceURI).toLowerCase();return /premium|プレミアム|高品質/.test(t)?3:/enhanced|拡張|強化|加強|增強/.test(t)?2:/kyoko|o-ren|otoya|google/.test(t)?1:0};
function pickVoice(){const vs=jaVoices();const saved=store.get("voice","");
  jaVoice=vs.find(v=>v.voiceURI===saved)||vs.slice().sort((a,b)=>voiceRank(b)-voiceRank(a))[0]||null;fillVoiceSel()}
function fillVoiceSel(){const sel=$("#voiceSel");if(!sel)return;const vs=jaVoices();
  sel.innerHTML=vs.length?vs.map(v=>`<option value="${esc(v.voiceURI)}"${jaVoice&&v.voiceURI===jaVoice.voiceURI?" selected":""}>${esc(v.name)}</option>`).join(""):`<option>這台裝置沒有日文語音</option>`;
  sel.disabled=!vs.length}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
document.addEventListener("change",e=>{if(e.target.id==="voiceSel"){store.set("voice",e.target.value);pickVoice();speak("こんにちは")}});
document.addEventListener("click",e=>{if(e.target.closest("#voiceTry"))speak("こんにちは、よろしくお願いします")});
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=.9;if(jaVoice)u.voice=jaVoice;speechSynthesis.speak(u);
}

const V={group:null,from:null,to:null,cat:"",pos:"",date:"",list:[],i:0,back:false,open:false,zh:false};
function vocabGroups(){return [...new Set(ME.vocab.map(v=>v[7]))]}
function groupWords(){return ME.vocab.filter(v=>v[7]===V.group)}
function hasLesson(){return groupWords().some(v=>v[0]>0)}
function lessonRange(){const ls=groupWords().map(v=>v[0]).filter(n=>n>0);return ls.length?[Math.min(...ls),Math.max(...ls)]:[0,0]}
const CAT_ORDER=["抽象","人物・身分","心與行為","物品","身體・自然"];
function uniq(idx){const a=[...new Set(groupWords().map(v=>v[idx]||"").filter(Boolean))];
  if(idx===8)a.sort((x,y)=>(CAT_ORDER.indexOf(x)+1||99)-(CAT_ORDER.indexOf(y)+1||99));
  else if(idx===9)a.sort().reverse();else a.sort();return a}
function buildList(keepOrder){
  const les=hasLesson();
  V.list=groupWords().map((v,k)=>[v,k]).filter(([v])=>(!les||(v[0]>=V.from&&v[0]<=V.to))&&(!V.cat||v[8]===V.cat)&&(!V.pos||v[3]===V.pos)&&(!V.date||v[9]===V.date));
  if(les)V.list.sort((a,b)=>a[0][0]-b[0][0]||a[1]-b[1]);
  V.list=V.list.map(x=>x[0]);
  V.i=0;resetCard();
}
function resetCard(){V.back=false;V.open=false;V.zh=false}
function openVocab(){
  $("#topTitle").textContent="單字卡";document.title="單字卡｜日語教室";
  if(!ME.vocab||!ME.vocab.length){$("#main").innerHTML=`<div class="box empty">還沒有可以背的單字</div>`;return}
  const gs=vocabGroups();const saved=store.get("vocab",{});
  V.group=gs.includes(saved.group)?saved.group:gs[0];
  const [lo,hi]=lessonRange();
  V.from=Math.max(lo,Math.min(hi,saved.from||lo));V.to=Math.max(V.from,Math.min(hi,saved.to||hi));
  V.cat=uniq(8).includes(saved.cat)?saved.cat:"";V.pos=uniq(3).includes(saved.pos)?saved.pos:"";V.date=uniq(9).includes(saved.date)?saved.date:"";
  document.body.classList.toggle("nokana",store.get("kana",true)===false);
  buildList();renderVocab();
}
function saveVocab(){store.set("vocab",{group:V.group,from:V.from,to:V.to,cat:V.cat,pos:V.pos,date:V.date})}
const mdDate=d=>{const m=/^\d{4}-(\d{1,2})-(\d{1,2})$/.exec(d);return m?`${+m[1]}/${+m[2]}`:d};
function renderVocab(){
  const gs=vocabGroups(),[lo,hi]=lessonRange();
  const opts=(sel)=>{let h="";for(let n=lo;n<=hi;n++)h+=`<option value="${n}"${n===sel?" selected":""}>${n}</option>`;return h};
  const kana=store.get("kana",true)!==false;
  const les=hasLesson();
  const sel=(id,label,vals,cur,fmt)=>vals.length?`<select id="${id}" aria-label="${label}" class="${cur?"on":""}"><option value="">全部${label}</option>${vals.map(x=>`<option value="${esc(x)}"${x===cur?" selected":""}>${esc(fmt?fmt(x):x)}</option>`).join("")}</select>`:"";
  const fil=[sel("vcat","分類",uniq(8),V.cat),sel("vpos","詞性",uniq(3),V.pos),sel("vdate","日期",uniq(9),V.date,mdDate)].filter(Boolean);
  const w=V.list[V.i];
  let card="",ex="",prog="";
  if(!w){card=`<div class="box empty">這個條件沒有單字</div>`}
  else{
    const [ls,word,furi,pos,zh,exj,exz]=w;
    prog=(ls>0?`第 ${ls} 課・`:w[8]?`${esc(w[8])}・`:"")+`${V.i+1} / ${V.list.length}`;
    if(!V.back){
      card=`<div class="box vcard fluff" id="vcard" role="button" tabindex="0" aria-label="翻面">
        <button class="vspk" id="vspk" aria-label="念出讀音">${ICON_SPK}</button>
        <button class="reveal${V.open?" open":""}" id="reveal" lang="ja">${V.open?ruby(furi,true):ICON_EYE+"點一下看日文"}</button>
        <div class="vhint">${V.open?"點卡片翻面看中文":"先聽讀音，想想看是哪個字"}</div></div>`;
      ex=exj?`<div class="box vex"><div class="jp" lang="ja">${exampleHTML(exj,V.open?"open":"blank")}</div><small>點卡片翻面看中文</small></div>`:"";
    }else{
      card=`<div class="box vcard backside fluff" id="vcard" role="button" tabindex="0" aria-label="翻回正面">
        ${pos?`<span class="vpos">${esc(pos)}</span>`:""}
        <button class="vspk" id="vspk" aria-label="念出讀音">${ICON_SPK}</button>
        <div class="vzh">${esc(zh)}</div>
        <div class="vjp" lang="ja">${ruby(furi,true)}</div></div>`;
      ex=exj?`<div class="box vex"><div class="jp tap" id="exjp" lang="ja" role="button" tabindex="0">${exampleHTML(exj,"full")}</div>${V.zh?`<div class="zh">${esc(exz)}</div>`:`<small>點例句看中文翻譯</small>`}</div>`:"";
    }
  }
  $("#main").innerHTML=`<div class="vwrap">
    <div class="vctl">
      ${gs.length>1?`<select id="vgrp" aria-label="單字組">${gs.map(g=>`<option${g===V.group?" selected":""}>${esc(g)}</option>`).join("")}</select>`:""}
      ${les?`<label>第<select id="vfrom" aria-label="從第幾課">${opts(V.from)}</select>課</label><span>～</span>
      <label>第<select id="vto" aria-label="到第幾課">${opts(V.to)}</select>課</label>`:""}
      <span class="sp"></span>
      <button class="tgl" id="kana" aria-pressed="${kana}">假名<i></i></button>
    </div>
    ${fil.length?`<div class="vfil">${fil.join("")}</div>`:""}
    <div class="vprog">${prog}</div>
    ${card}${ex}
    <div class="vnav"><button class="btn" id="vprev">上一張</button><button class="btn" id="vshuf">${ICON_SHUF}洗牌</button><button class="btn main" id="vnext">下一張</button></div>
  </div>`;
  const g=$("#vgrp");if(g)g.onchange=()=>{V.group=g.value;const [a,b]=lessonRange();V.from=a;V.to=b;V.cat=V.pos=V.date="";saveVocab();buildList();renderVocab()};
  const re=()=>{saveVocab();buildList();renderVocab()};
  const vf=$("#vfrom"),vt=$("#vto");
  if(vf)vf.onchange=e=>{V.from=+e.target.value;if(V.to<V.from)V.to=V.from;re()};
  if(vt)vt.onchange=e=>{V.to=+e.target.value;if(V.from>V.to)V.from=V.to;re()};
  [["vcat","cat"],["vpos","pos"],["vdate","date"]].forEach(([id,k])=>{const el=$("#"+id);if(el)el.onchange=()=>{V[k]=el.value;re()}});
  $("#kana").onclick=()=>{const on=store.get("kana",true)===false;store.set("kana",on);document.body.classList.toggle("nokana",!on);$("#kana").setAttribute("aria-pressed",on)};
  $("#vprev").onclick=()=>{if(!V.list.length)return;V.i=(V.i-1+V.list.length)%V.list.length;resetCard();renderVocab()};
  $("#vnext").onclick=()=>{if(!V.list.length)return;V.i=(V.i+1)%V.list.length;resetCard();renderVocab()};
  $("#vshuf").onclick=()=>{V.list=shuffle(V.list);V.i=0;resetCard();renderVocab()};
  if(!w)return;
  const flip=()=>{V.back=!V.back;V.zh=false;renderVocab()};
  $("#vcard").onclick=flip;
  $("#vcard").onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&e.target.id==="vcard"){e.preventDefault();flip()}};
  $("#vspk").onclick=e=>{e.stopPropagation();speak(reading(w[2]))};
  const rv=$("#reveal");if(rv)rv.onclick=e=>{e.stopPropagation();V.open=!V.open;renderVocab()};
  const ej=$("#exjp");if(ej){const t=()=>{V.zh=!V.zh;renderVocab()};ej.onclick=t;ej.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t()}}}
}

/* ===== 啟動 ===== */
(async()=>{
  applyTheme(store.get("theme","blue"));
  const cache=store.get("me",null);
  // 有快取就先顯示，背景再更新
  if(cache&&cache.user&&cache.user.displayName){ME={...cache,offline:false};enterApp()}
  else{show("scrLogin");setVer();$("#loginMsg").textContent="載入中…"}
  const ok=await initGsi();
  if(ok&&$("#loginMsg").textContent==="載入中…")$("#loginMsg").textContent="";
  if(tokenOk()){loadMe();return}
  if(cache&&cache.user&&cache.user.displayName&&ok){
    // 已登入過：自動取得新的登入憑證
    google.accounts.id.prompt();
    return;
  }
  renderLogin();
})();
